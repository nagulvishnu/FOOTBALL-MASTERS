# Render Blueprint: single long-running Node web service.
# Architecture: Next.js app + in-process authoritative room server + SSE/POST.
# Keep ONE instance: rooms and SSE subscribers live in process memory.
services:
  - type: web
    name: football-masters
    runtime: node
    plan: starter            # free sleeps and has limited CPU; not reliable for steady 14-player matches
    numInstances: 1
    buildCommand: npm ci && npm run build
    preDeployCommand: npx drizzle-kit migrate --config drizzle.config.prod.ts
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT; Next.js `npm start` binds to it automatically.
      - key: DATABASE_URL
        sync: false          # REQUIRED: Neon pooled PostgreSQL URL (keep secret in Render dashboard)
      - key: PG_POOL_MAX
        value: "10"          # optional tuning; keep modest for small instances / Neon poolers
      # Do NOT set COOKIE_INSECURE in production. Session cookies are always Secure over HTTPS.
